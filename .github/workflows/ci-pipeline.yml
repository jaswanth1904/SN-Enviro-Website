name: SN Enviro CI/CD Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Level 1-3: Backend Testing
  backend-tests:
    name: Backend API & Model Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Install Backend Dependencies
        run: npm install
        
      - name: Run Jest & Supertest
        run: npm run test

  # Level 1-2: Frontend Component Testing
  frontend-tests:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Install Frontend Dependencies
        run: npm install
        
      - name: Run Vitest
        run: npm run test

  # Level 4: End-to-End Cypress Testing
  e2e-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          # Note: Since your cypress config points to the live snenviro.org URL, 
          # it will test the live site automatically without starting local servers.
